services:
  mysql:
    image: mysql:8.0
    container_name: clinica_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password_segura}
      MYSQL_DATABASE: ${DB_NAME:-clinica_db}
      MYSQL_USER: ${DB_USER:-clinica_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-clinica_pass123}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password_segura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql_data:
    name: clinica_mysql_data
    driver: local
